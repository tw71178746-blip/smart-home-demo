
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART HOME</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .card h3 {
      color: #94a3b8;
      font-size: 15px;
      margin-top: 0;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
    }

    .unit {
      font-size: 16px;
      color: #94a3b8;
    }

    .section {
      margin-top: 28px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px 5px 5px 0;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .stop {
      background: #dc2626;
    }

    .stop:hover {
      background: #b91c1c;
    }

    .status {
      color: #94a3b8;
      margin: 12px 0;
      line-height: 1.6;
    }

    #map {
      width: 100%;
      height: 350px;
      border-radius: 12px;
      margin-top: 15px;
      background: #334155;
    }

    .notice {
      padding: 14px;
      background: #334155;
      border-radius: 8px;
      margin-top: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      #map {
        height: 280px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>SMART HOME</h1>
    <div class="subtitle">스마트홈 환경 모니터링 시스템</div>

    <div class="grid">

      <div class="card">
        <h3>온도</h3>
        <div class="value">
          <span id="temperature">--</span>
          <span class="unit">°C</span>
        </div>
      </div>

      <div class="card">
        <h3>습도</h3>
        <div class="value">
          <span id="humidity">--</span>
          <span class="unit">%</span>
        </div>
      </div>

      <div class="card">
        <h3>미세먼지</h3>
        <div class="value">
          <span id="dust">--</span>
        </div>
      </div>

      <div class="card">
        <h3>MQ-135 공기질 센서</h3>
        <div class="value">
          <span id="gas">--</span>
        </div>
      </div>

      <div class="card">
        <h3>창문 상태</h3>
        <div class="value" id="windowState">--</div>
      </div>

      <div class="card">
        <h3>빗물 감지</h3>
        <div class="value" id="rain">--</div>
      </div>

      <div class="card">
        <h3>가습기</h3>
        <div class="value" id="humidifier">--</div>
      </div>

      <div class="card">
        <h3>환풍기</h3>
        <div class="value" id="fan">--</div>
      </div>

    </div>

    <div class="section card">
      <h2>사용자 위치 공유</h2>

      <p class="status" id="locationStatus">
        현재 위치 공유가 시작되지 않았습니다.
      </p>

      <button id="startButton" onclick="startLocationShare()">
        위치 공유 시작
      </button>

      <button id="stopButton" class="stop"
        onclick="stopLocationShare()" disabled>
        위치 공유 종료
      </button>

      <div class="notice" id="shareNotice">
        위치 공유 대기 중
      </div>

      <p>위도: <span id="latitude">--</span></p>
      <p>경도: <span id="longitude">--</span></p>

      <div id="map"></div>
    </div>

    <p class="status" id="firebaseStatus">
      Firebase 연결 확인 중...
    </p>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Firebase 데이터베이스 주소
    const FIREBASE_URL =
      "https://smart-home-demo-52a8a-default-rtdb.asia-southeast1.firebasedatabase.app";

    const LOCATION_URL = FIREBASE_URL + "/locationShare.json";

    // 위치 공유 설정
    const SHARE_TIME = 30000;
    const HEARTBEAT_TIME = 10000;

    let map = null;
    let locationMarker = null;
    let watchId = null;
    let heartbeatTimer = null;
    let statusTimer = null;

    let isSharing = false;

    // 사용자별 임시 식별값
    let locationUserId = "";

    function createUserId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return "user-" + Date.now() + "-" +
        Math.random().toString(16).slice(2);
    }

    locationUserId = createUserId();

    // 지도 초기화
    function initializeMap() {
      map = L.map("map").setView([37.5665, 126.9780], 13);

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);
    }

    initializeMap();

    // 지도에 위치 표시
    function updateMap(latitude, longitude) {
      const position = [latitude, longitude];

      if (!locationMarker) {
        locationMarker = L.marker(position).addTo(map);
        locationMarker.bindPopup("현재 공유 위치");
      } else {
        locationMarker.setLatLng(position);
      }

      map.setView(position, 16);
    }

    // Firebase 센서 데이터 가져오기
    async function getData() {
      try {
        const response = await fetch(FIREBASE_URL + "/.json");

        if (!response.ok) {
          throw new Error("Firebase 응답 오류: " + response.status);
        }

        const data = await response.json();

        if (!data) return;

        document.getElementById("temperature").textContent =
          data.temperature ?? "--";

        document.getElementById("humidity").textContent =
          data.humidity ?? "--";

        document.getElementById("dust").textContent =
          data.dust ?? "--";

        document.getElementById("gas").textContent =
          data.gas ?? "--";

        document.getElementById("windowState").textContent =
          data.windowState ?? "--";

        document.getElementById("rain").textContent =
          data.rain ?? "--";

        document.getElementById("humidifier").textContent =
          data.humidifier ?? "--";

        document.getElementById("fan").textContent =
          data.fan ?? "--";

        document.getElementById("firebaseStatus").textContent =
          "Firebase 연결 성공";

      } catch (error) {
        document.getElementById("firebaseStatus").textContent =
          "Firebase 연결 실패: " + error.message;

        console.error(error);
      }
    }

    // 위치 공유 상태 확인
    async function getShareData() {
      const response = await fetch(LOCATION_URL);

      if (!response.ok) {
        throw new Error("위치 공유 정보 확인 실패");
      }

      return await response.json();
    }

    // 위치 공유 잠금 획득
    async function acquireLocationShare() {
      const response = await fetch(LOCATION_URL, {
        method: "GET",
        headers: {
          "X-Firebase-ETag": "true"
        }
      });

      if (!response.ok) {
        throw new Error("Firebase 위치 확인 실패");
      }

      const etag = response.headers.get("ETag");

      if (!etag) {
        throw new Error("Firebase ETag를 가져오지 못했습니다.");
      }

      const data = await response.json();
      const now = Date.now();

      // 다른 사용자의 공유가 아직 유효한 경우
      if (
        data &&
        data.active === true &&
        data.owner !== locationUserId &&
        Number(data.expiresAt || 0) > now
      ) {
        return false;
      }

      // 잠금 정보 저장
      const updateResponse = await fetch(LOCATION_URL, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "if-match": etag
        },
        body: JSON.stringify({
          active: true,
          owner: locationUserId,
          latitude: null,
          longitude: null,
          lastUpdate: now,
          expiresAt: now + SHARE_TIME
        })
      });

      // 다른 사용자가 먼저 잠금을 획득한 경우
      if (updateResponse.status === 412) {
        return false;
      }

      if (!updateResponse.ok) {
        throw new Error("위치 공유 잠금 저장 실패");
      }

      return true;
    }

    // 위치 공유 상태 화면 갱신
    async function checkShareStatus() {
      try {
        const data = await getShareData();

        if (
          data &&
          data.active === true &&
          Number(data.expiresAt || 0) > Date.now() &&
          data.owner !== locationUserId
        ) {
          document.getElementById("shareNotice").textContent =
            "현재 위치를 공유하고 있는 사용자가 있습니다.";
        } else if (!isSharing) {
          document.getElementById("shareNotice").textContent =
            "현재 위치 공유 가능";
        }

      } catch (error) {
        console.error("공유 상태 확인 오류:", error);
      }
    }

    // 실시간 위치 Firebase 전송
    async function sendLocation(latitude, longitude) {
      if (!isSharing) return;

      const response = await fetch(LOCATION_URL, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          latitude: latitude,
          longitude: longitude,
          lastUpdate: Date.now(),
          expiresAt: Date.now() + SHARE_TIME
        })
      });

      if (!response.ok) {
        throw new Error("위치 전송 실패");
      }
    }

    // 위치 정보를 화면에 표시
    function displayLocation(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      document.getElementById("latitude").textContent =
        latitude.toFixed(6);

      document.getElementById("longitude").textContent =
        longitude.toFixed(6);

      updateMap(latitude, longitude);

      sendLocation(latitude, longitude).catch(error => {
        document.getElementById("locationStatus").textContent =
          error.message;

        console.error(error);
      });
    }

    // 위치 공유 시작
    async function startLocationShare() {
      if (!navigator.geolocation) {
        alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
        return;
      }

      if (isSharing) return;

      document.getElementById("locationStatus").textContent =
        "위치 공유 확인 중...";

      try {
        const acquired = await acquireLocationShare();

        if (!acquired) {
          document.getElementById("shareNotice").textContent =
            "현재 위치를 공유하고 있는 사용자가 있습니다.";

          document.getElementById("locationStatus").textContent =
            "다른 사용자의 공유가 끝날 때까지 기다려 주세요.";

          return;
        }

        isSharing = true;

        document.getElementById("startButton").disabled = true;
        document.getElementById("stopButton").disabled = false;

        document.getElementById("shareNotice").textContent =
          "내 위치를 공유하고 있습니다.";

        document.getElementById("locationStatus").textContent =
          "브라우저 위치 권한을 확인하고 있습니다.";

        watchId = navigator.geolocation.watchPosition(
          displayLocation,

          async function(error) {
            document.getElementById("locationStatus").textContent =
              "위치 확인 실패: " + error.message;

            await stopLocationShare();
          },

          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000
          }
        );

        // 공유 잠금 갱신
        heartbeatTimer = setInterval(async function() {
          try {
            const data = await getShareData();

            if (!data || data.owner !== locationUserId) {
              await stopLocationShare();
              return;
            }

            await fetch(LOCATION_URL, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                expiresAt: Date.now() + SHARE_TIME
              })
            });

          } catch (error) {
            console.error("공유 갱신 실패:", error);
          }
        }, HEARTBEAT_TIME);

      } catch (error) {
        document.getElementById("locationStatus").textContent =
          "위치 공유 실패: " + error.message;

        console.error(error);
      }
    }

    // 위치 공유 종료
    async function stopLocationShare() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      if (heartbeatTimer !== null) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }

      isSharing = false;

      document.getElementById("startButton").disabled = false;
      document.getElementById("stopButton").disabled = true;

      document.getElementById("locationStatus").textContent =
        "위치 공유가 종료되었습니다.";

      document.getElementById("shareNotice").textContent =
        "위치 공유 대기 중";

      try {
        const response = await fetch(LOCATION_URL, {
          method: "GET",
          headers: {
            "X-Firebase-ETag": "true"
          }
        });

        if (response.ok) {
          const etag = response.headers.get("ETag");
          const data = await response.json();

          // 본인이 소유한 공유 정보만 종료
          if (
            data &&
            data.owner === locationUserId &&
            etag
          ) {
            await fetch(LOCATION_URL, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "if-match": etag
              },
              body: JSON.stringify({
                active: false,
                owner: null,
                latitude: null,
                longitude: null,
                lastUpdate: Date.now(),
                expiresAt: 0
              })
            });
          }
        }

      } catch (error) {
        console.error("공유 종료 처리 오류:", error);
      }

      checkShareStatus();
    }

    // 처음 실행
    getData();
    checkShareStatus();

    // 센서 데이터 주기적 갱신
    setInterval(getData, 3000);

    // 다른 사용자 공유 상태 주기적 확인
    statusTimer = setInterval(checkShareStatus, 5000);

    // 페이지 종료 시 위치 추적 중단
    window.addEventListener("beforeunload", function() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }
    });
  </script>
</body>
</html>
